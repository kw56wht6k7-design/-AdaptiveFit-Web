</style></head><body data-theme="dark"><div id="app"></div><div id="modalRoot"></div><div id="toast" class="toast hide"></div>
<script>
'use strict';
const KEY='adaptivefit_browser_first_run_v1';
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const LONG=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const GOALS=[['muscle','Muskelaufbau','💪'],['condition','Kondition','⚡'],['endurance','Ausdauer','❤️'],['strength','Kraftsteigerung','🏋️'],['fat','Fettabbau','🔥'],['mobility','Beweglichkeit','🧘'],['health','Gesundheit','🌿']];
const MODES=[['gym','Fitnessstudio','🏋️'],['home','Zuhause','🏠'],['outside','Outdoor','🌳'],['flexible','Flexibel','🔄']];
const DEF=()=>({onboard:0,finished:false,activeWeek:null,weekData:{},eventGoal:{type:'',name:'',date:'',baseline:''},weightHistory:[],checkinHistory:[],checkinWeight:'',quickDraft:'',quickTarget:'today',proposal:null,screen:'home',theme:'dark',profile:{name:'',age:'',height:'',weight:'',level:'beginner',goals:['muscle','condition','endurance'],priority:'muscle',mode:'combined',places:['gym','home'],limitations:'',weeklyGoal:4,intensity:'balanced',checkinTiming:['morning','pre','post','weekly'],reminders:false},availability:[{on:true,start:'18:00',minutes:60},{on:false,start:'18:00',minutes:45},{on:true,start:'18:00',minutes:60},{on:false,start:'18:00',minutes:45},{on:true,start:'18:00',minutes:60},{on:false,start:'10:00',minutes:60},{on:true,start:'10:00',minutes:75}],checkin:{energy:3,sleep:'okay',stress:2,soreness:1,pain:false},plan:[],logs:{},done:{},session:-1,coachHistory:[],timer:0});
let s=DEF(),clock=null, running=false,modal=null;
try{const raw=localStorage.getItem(KEY);if(raw){const existing=JSON.parse(raw);s={...DEF(),...existing,profile:{...DEF().profile,...(existing.profile||{})},checkin:{...DEF().checkin,...(existing.checkin||{})},eventGoal:{...DEF().eventGoal,...(existing.eventGoal||{})},weightHistory:Array.isArray(existing.weightHistory)?existing.weightHistory:[],checkinHistory:Array.isArray(existing.checkinHistory)?existing.checkinHistory:[]}}}catch(e){console.warn('Storage not available:',e)}
// Training week starts on Monday. Dates are calculated at noon to avoid DST edge cases.
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekKey(date=new Date()){const d=new Date(date);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return localISO(d)}
function weekShift(key,delta){const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+delta*7);return localISO(d)}
function dateForWeekDay(key,i){const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+i);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}
function weekLabel(key){const start=new Date(key+'T12:00:00');const end=new Date(start);end.setDate(end.getDate()+6);return start.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' – '+end.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function weekNumber(key){const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+3);const y=new Date(d.getFullYear(),0,4,12);y.setDate(y.getDate()-((y.getDay()+6)%7));return 1+Math.round((d-y)/604800000)}
function blankAvailability(){return DEF().availability.map(x=>({...x,on:false}))}
function syncWeek(){if(!s.activeWeek)return;s.weekData=s.weekData||{};s.weekData[s.activeWeek]={availability:s.availability.map(x=>({...x})),plan:s.plan,logs:s.logs,done:s.done,session:s.session}}
function loadWeek(key){const d=(s.weekData||{})[key];s.availability=d&&Array.isArray(d.availability)?d.availability.map(x=>({...x})):blankAvailability();s.plan=d&&Array.isArray(d.plan)?d.plan:[];s.logs=d&&d.logs?d.logs:{};s.done=d&&d.done?d.done:{};s.session=d&&Number.isInteger(d.session)?d.session:-1}
function initWeeks(){const today=weekKey();if(!s.activeWeek){s.activeWeek=today;syncWeek()}else if(s.activeWeek!==today){syncWeek();s.activeWeek=today;loadWeek(today)}else if(!s.weekData||!s.weekData[s.activeWeek]){syncWeek()}}
function goWeek(key){syncWeek();s.activeWeek=key;loadWeek(key);s.quickTarget='today';s.proposal=null;save();render();window.scrollTo(0,0)}
function weekSelector(){return `<div class="card col" style="margin-bottom:16px"><div class="flex between wrap"><div><div class="eyebrow">DEINE WOCHENPLANUNG</div><h3>KW ${weekNumber(s.activeWeek)} · ${weekLabel(s.activeWeek)}</h3><p class="muted small">Lege deine Trainingstage und Startzeiten für jede Woche neu fest.</p></div><div class="flex gap8 wrap"><button class="btn small ghost" data-action="prevWeek">← Vorherige</button><button class="btn small ghost" data-action="todayWeek">Aktuelle Woche</button><button class="btn small ghost" data-action="nextWeek">Nächste →</button></div></div>${!s.plan.length?'<div class="mutebg small">Für diese Kalenderwoche gibt es noch keinen Trainingsplan. Wähle deine freien Tage und erstelle den Plan für genau diese Woche.</div>':''}${!s.availability.some(x=>x.on)?'<div class="flex gap8 wrap"><button class="btn small" data-action="copyPrevious">↻ Zeiten der Vorwoche übernehmen</button></div>':''}</div>`}
initWeeks();
function save(){syncWeek();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
function escapeHTML(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function displayGoal(g){return GOALS.find(x=>x[0]===g)?.[1]||g} function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hide');clearTimeout(notify._t);notify._t=setTimeout(()=>el.classList.add('hide'),2800)}
function persistRender(){save();render()}
function setTheme(){document.body.dataset.theme=s.theme}
function btn(text,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`}
function chips(arr,v,action){return `<div class="grid two">${arr.map(([id,label,icon])=>`<button class="choice ${v.includes(id)?'active':''}" data-action="${action}" data-val="${id}"><span class="flex"><span class="symbol">${icon}</span><strong>${label}</strong></span><span class="check">${v.includes(id)?'✓':'+'}</span></button>`).join('')}</div>`}
function radioChoices(arr,value,action){return `<div class="grid two">${arr.map(([id,label,desc])=>`<button class="choice ${id===value?'active':''}" data-action="${action}" data-val="${id}"><span><strong>${label}</strong>${desc?`<br><small>${desc}</small>`:''}</span><span class="check">${id===value?'✓':''}</span></button>`).join('')}</div>`}
const EVENT_TYPES=[['','Kein Ereignisziel'],['marathon','Marathon'],['half','Halbmarathon'],['10k','10-km-Lauf'],['5k','5-km-Lauf'],['race','Anderes Laufevent'],['other','Anderes Ereignis']];
function eventIsRunning(){return ['marathon','half','10k','5k','race'].includes(s.eventGoal.type)}
function eventWeeks(){const e=s.eventGoal;if(!e?.type||!e.date)return null;const d=new Date(e.date+'T12:00:00');if(Number.isNaN(d.getTime()))return null;return Math.ceil((d-new Date(localISO(new Date())+'T12:00:00'))/604800000)}
function eventTitle(){return s.eventGoal.name.trim()||EVENT_TYPES.find(x=>x[0]===s.eventGoal.type)?.[1]||'Dein Ereignis'}
function goalSummary(){const e=s.eventGoal,w=eventWeeks();if(!e.type)return '';if(!e.date)return 'Lege noch das Datum deines Ereignisses fest.';if(w===null)return 'Bitte gültiges Datum wählen.';if(w<0)return 'Das Ereignisdatum liegt in der Vergangenheit. Wähle ein neues Ziel.';return `${escapeHTML(eventTitle())} · ${new Date(e.date+'T12:00:00').toLocaleDateString('de-DE')} · ${w===0?'Diese Woche':w+' Wochen verbleiben'}`}
function eventGoalEditor(){const e=s.eventGoal;return `<div class="card soft col"><div class="flex between wrap"><strong>🏁 Übergeordnetes Ereignisziel</strong><span class="pill">Optional</span></div><p class="muted small">Trainiere auf ein konkretes Datum hin – z. B. einen Marathon, Lauf oder eine andere Herausforderung.</p><div class="field"><label>Ereignisart</label><select data-field="eventType">${EVENT_TYPES.map(([id,t])=>`<option value="${id}" ${e.type===id?'selected':''}>${t}</option>`).join('')}</select></div>${e.type?`<div class="field"><label>Name des Ereignisses (optional)</label><input data-field="eventName" placeholder="z. B. Berlin-Marathon" value="${escapeHTML(e.name)}"></div><div class="field"><label>Datum des Ereignisses</label><input type="date" data-field="eventDate" value="${escapeHTML(e.date)}"></div>${eventIsRunning()?`<div class="field"><label>Aktuelles Laufpensum pro Woche in km (optional)</label><input type="number" min="0" max="350" step="0.5" inputmode="decimal" data-field="eventBaseline" placeholder="z. B. 12" value="${escapeHTML(e.baseline)}"></div>`:''}<div class="mutebg small">${goalSummary()}${eventIsRunning()?'<br>Das Laufpensum dient später der sicheren Individualisierung. Diese Demo legt keine automatischen Kilometersteigerungen fest.':''}</div>`:''}</div>`}
function weightSummary(){const a=(s.weightHistory||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));const last=a.at(-1);if(!last)return s.profile.weight?`${escapeHTML(s.profile.weight)} kg (Profilwert)`:'Noch kein Gewicht erfasst';const prior=a.length>1?a[a.length-2]:null;return `${Number(last.kg).toLocaleString('de-DE')} kg · ${new Date(last.date+'T12:00:00').toLocaleDateString('de-DE')}${prior?' · Veränderung seit letzter Messung '+(last.kg-prior.kg).toFixed(1).replace('.',',')+' kg':''}`}
function recordCheckin(){let raw=String(s.checkinWeight??'').trim().replace(',','.');if(raw&&(!Number.isFinite(Number(raw))||Number(raw)<25||Number(raw)>400)){notify('Bitte ein plausibles Gewicht in kg eingeben oder das Feld leer lassen.');return false}const date=localISO(new Date()),old=(s.checkinHistory||[]).find(x=>x.date===date);const kg=raw?Number(raw):(old?.weight??null);s.checkinHistory=(s.checkinHistory||[]).filter(x=>x.date!==date);s.checkinHistory.push({date,...s.checkin,weight:kg,timestamp:Date.now()});s.checkinHistory.sort((a,b)=>a.date.localeCompare(b.date));if(raw){s.weightHistory=(s.weightHistory||[]).filter(x=>x.date!==date);s.weightHistory.push({date,kg:Number(raw)});s.weightHistory.sort((a,b)=>a.date.localeCompare(b.date));s.profile.weight=String(raw)}s.checkinWeight='';modal=null;persistRender();notify('Check-in für heute gespeichert.');return true}

function checkinFrequency(){const n=(s.checkinHistory||[]).filter(x=>weekKey(new Date(x.date+'T12:00:00'))===weekKey()).length;return n?`${n} gespeicherte Check-ins diese Woche. ${weightSummary()}`:'Noch kein Check-in diese Woche gespeichert. Erfasse regelmäßig Schlaf, Energie, Stress und optional Gewicht.'}
function tailorPlanToEvent(){const g=s.eventGoal;if(!eventIsRunning()||!g.date||!s.plan.length)return;const deadline=new Date(g.date+'T12:00:00');if(Number.isNaN(+deadline)||deadline<new Date(s.activeWeek+'T12:00:00'))return;const last=s.plan[s.plan.length-1];last.name='🏃 Ruhiger Lauf für dein Ziel';last.main='Ausdauer';last.secondary=eventTitle();last.strength=[];last.cardio='Ruhiger Lauf oder Lauf-Geh-Einheit';last.cardioMinutes=last.minutes;last.note='Trainingsdauer nach Verfügbarkeit; keine automatische Kilometersteigerung.';if(s.plan.length>=3){const x=s.plan[1];x.name='Kraft + lockerer Lauf';x.strength=x.strength.slice(0,2);x.cardio='Lockerer Lauf / Lauf-Geh-Abschnitte';x.cardioMinutes=Math.round(x.minutes*.45);x.secondary='Laufvorbereitung';x.note='Kombinierte Einheit mit verkürztem Kraftteil.'}}
function parseIntent(raw){const z=String(raw||'').toLocaleLowerCase('de').trim();if(!z)return null;const m=z.match(/(\d{1,3})\s*(?:minuten|min\.?)(?:\b|$)/),mins=m?Math.max(10,Math.min(180,Number(m[1]))):null;const type=/lauf|jogg|renn/.test(z)?'run':/radfahr|fahrrad|radeln|cycling|bike/.test(z)?'bike':/mobility|beweglichkeit|yoga|dehnen|stretch/.test(z)?'mobility':/pause|erholung|regeneration|ruhetag|frei(?:er)? tag/.test(z)?'rest':/leicht|müde|erschöpf|weniger intensiv/.test(z)?'light':mins||/wenig zeit|verkürz|kurz trainieren/.test(z)?'short':null;return type?{type,mins}:null}
function sessionHasHistory(w){return !!(w&&(s.done[w.id]||Object.keys(s.logs||{}).some(k=>k.startsWith(w.id+'-'))))}
function proposalHtml(){const p=s.proposal;if(!p)return '';return `<div class="card col" style="border-color:var(--acc)"><div class="eyebrow">VORSCHAU · NICHT ÜBERNOMMEN</div><h3>${escapeHTML(p.title)}</h3><div class="mutebg"><div class="small muted">Bisher</div><strong>${escapeHTML(p.before)}</strong><div class="spacer"></div><div class="small muted">Vorschlag</div><strong>${escapeHTML(p.after.name)}</strong><p class="small muted">${p.after.minutes} Min. · ${p.after.strength.length} Kraftübungen · ${p.after.cardioMinutes} Min. Ausdauer / Bewegung</p></div><p class="small muted">${escapeHTML(p.reason)}</p><div class="flex wrap gap8"><button class="btn primary" data-action="applyProposal">Übernehmen</button><button class="btn" data-action="rejectProposal">Verwerfen</button></div></div>`}
function proposeText(raw){const intent=parseIntent(raw);if(!intent){notify('Ich verstehe bisher z. B. „Heute nur laufen“, „30 Minuten Radfahren“ oder „Pause“.');return false}if(s.quickTarget==='today'&&s.activeWeek!==weekKey()){notify('Wähle für „heute“ zuerst die aktuelle Kalenderwoche.');return false}const day=s.quickTarget==='today'?dayNow():null;const idx=s.quickTarget==='today'?s.plan.findIndex(x=>x.day===day):Number(s.quickTarget);const old=idx>=0?s.plan[idx]:null;if(s.quickTarget!=='today'&&!old){notify('Wähle zuerst ein Training aus.');return false}if(sessionHasHistory(old)){notify('Diese Einheit ist bereits protokolliert. Wähle eine noch offene Einheit.');return false}if(s.checkin.pain&&['run','bike'].includes(intent.type)){notify('Bei gemeldeten Schmerzen schlagen wir kein Lauf- oder Radtraining vor.');return false}const targetDay=old?old.day:day,minutes=intent.mins||(old?old.minutes:45);const w=old?{...old,strength:old.strength.map(x=>({...x}))}:{id:`w${s.activeWeek}-${targetDay}-manual`,day:targetDay,time:s.availability[targetDay]?.start||'18:00',minutes,name:'Freies Training',main:'Persönlich',secondary:'Wunsch',cardio:'',cardioMinutes:0,strength:[]};w.minutes=minutes;const names={run:'🏃 Nur laufen',bike:'🚲 Nur Radfahren',mobility:'🧘 Nur Mobility',rest:'⏸ Regeneration',short:'Verkürzte Einheit',light:'Leichtere Einheit'};if(intent.type==='run'||intent.type==='bike'||intent.type==='mobility'||intent.type==='rest'){w.name=names[intent.type];w.strength=[];w.cardio=intent.type==='run'?'Locker laufen oder Lauf-Geh-Abschnitte':intent.type==='bike'?'Radfahren nach Befinden':intent.type==='mobility'?'Mobilitätsübungen':'Pause / Erholung';w.cardioMinutes=intent.type==='rest'?0:minutes;w.main=intent.type==='rest'?'Erholung':intent.type==='mobility'?'Mobilität':'Ausdauer';w.secondary='Spontaner Wunsch'}else if(intent.type==='short'){w.name=old?old.name+' (kurz)':'Kurzes Training';w.strength=w.strength.slice(0,2);w.cardioMinutes=Math.min(w.cardioMinutes,Math.round(minutes*.3))}else{w.name=old?old.name+' (leicht)':'Leichtes Training';w.strength=w.strength.map(x=>({...x,sets:Math.max(1,x.sets-1)}));w.cardioMinutes=Math.round(w.cardioMinutes*.5)}w.note='Dein Wunsch: '+String(raw).slice(0,150);s.proposal={title:'Dein spontaner Trainingswunsch',before:old?.name||'Kein Training heute geplant',after:w,idx,day:targetDay,reason:old?'Nur diese Einheit wird geändert. Deine anderen Einheiten und Wochen bleiben erhalten.':'Zusätzliche Einheit für heute. Bitte Gesamtbelastung und Erholung berücksichtigen.'};persistRender();return true}
function proposeLight(){const preferred=Number.isInteger(s.session)&&s.session>=0&&s.session<s.plan.length&&!sessionHasHistory(s.plan[s.session])?s.session:-1;const idx=preferred>=0?preferred:s.plan.findIndex(x=>!s.done[x.id]&&!sessionHasHistory(x));if(idx<0){notify('Keine unbegonnene Trainingseinheit gefunden.');return false}const old=s.plan[idx],w={...old,strength:old.strength.map(x=>({...x}))};if(s.checkin.pain){w.name='⏸ Pause / Erholung';w.strength=[];w.cardio='Pause';w.cardioMinutes=0;w.main='Erholung'}else{w.name=old.name+' · leicht';w.strength=w.strength.map(x=>({...x,sets:Math.max(1,x.sets-1)}));w.cardioMinutes=Math.round(w.cardioMinutes*.5);w.minutes=Math.max(15,Math.round(w.minutes*.75))}s.proposal={title:'Anpassung an deine Tagesform',before:old.name,after:w,idx,day:old.day,reason:wellnessNote()};persistRender();return true}
function applyProposal(){const p=s.proposal;if(!p)return;if(p.idx>=0){const old=s.plan[p.idx];if(!old||sessionHasHistory(old)){notify('Diese Einheit wurde inzwischen begonnen. Bitte Vorschlag neu erstellen.');s.proposal=null;persistRender();return}s.plan[p.idx]=p.after}else{if(s.plan.some(x=>x.day===p.day)){notify('Für den Tag gibt es inzwischen eine Einheit.');s.proposal=null;persistRender();return}s.availability[p.day].on=true;s.plan.push(p.after);s.plan.sort((a,b)=>a.day-b.day)}s.proposal=null;s.quickDraft='';persistRender();notify('Änderung übernommen. Dein restlicher Plan bleibt bestehen.')}
function quickEditCard(){return `<div class="card col"><div class="flex between wrap"><h3>✍️ Training einfach umplanen</h3><span class="pill">Textsteuerung (Demo)</span></div><p class="muted small">Schreibe zum Beispiel „Ich möchte heute nur laufen gehen“. Prüfe den Vorschlag und bestätige ihn.</p><div class="field"><label>Welche Einheit?</label><select data-field="quickTarget"><option value="today" ${s.quickTarget==='today'?'selected':''}>Heute · ${LONG[dayNow()]}</option>${s.plan.map((w,i)=>`<option value="${i}" ${String(s.quickTarget)===String(i)?'selected':''}>${LONG[w.day]} · ${escapeHTML(w.name)}</option>`).join('')}</select></div><div class="field"><label>Dein Wunsch</label><textarea data-field="quickDraft" placeholder="Heute möchte ich nur laufen gehen.">${escapeHTML(s.quickDraft||'')}</textarea></div><div class="flex wrap gap8"><button class="btn small ghost" data-action="exampleQuick" data-val="run">Nur laufen</button><button class="btn small ghost" data-action="exampleQuick" data-val="short">30 Min.</button><button class="btn small ghost" data-action="exampleQuick" data-val="rest">Pause</button></div><button class="btn primary block" data-action="previewQuick">Vorschlag anzeigen →</button>${proposalHtml()}<p class="small muted">Momentan erkennt die Demo einige typische Wünsche, noch keine freie KI-Sprache. Nichts wird ohne Bestätigung geändert.</p></div>`}
function wellnessCard(){return `<div class="card col"><strong>💚 Gewicht und Tagesform</strong><p class="muted small">${checkinFrequency()}</p><p class="small">${wellnessNote()}</p><div class="flex gap8 wrap"><button class="btn small" data-action="checkin">Check-in erfassen</button>${s.plan.length?'<button class="btn small" data-action="suggestLight">Leichtere Einheit vorschlagen</button>':''}</div>${s.proposal?.title==='Anpassung an deine Tagesform'?proposalHtml():''}</div>`}
function genPlan(){const selected=s.availability.map((d,i)=>({...d,day:i})).filter(x=>x.on);if(!selected.length){notify('Wähle mindestens einen Trainingstag.');return}let allowed=selected.slice(0,6);const p=s.profile; s.plan=allowed.map((slot,i)=>{const split=SPLITS[i%4];const mainly=p.priority==='endurance'?'Ausdauer':p.priority==='condition'?'Kondition':p.priority==='mobility'?'Beweglichkeit': 'Muskelaufbau';let secondary=mainly==='Muskelaufbau'?i%2?'Ausdauer':'Kondition':'Kraft';let ratio=p.mode==='separate'&&i%2===1?.4:p.priority==='muscle'||p.priority==='strength'?.72:.55;const cm=Math.max(7,Math.round(slot.minutes*(1-ratio)));return {id:`w${s.activeWeek}-${slot.day}-${i}`,day:slot.day,time:slot.start,minutes:slot.minutes,name:p.mode==='separate'&&i%2===1?`${secondary} – Fokus`:split.name,main:mainly,secondary,cardio:split.cardio,cardioMinutes:cm,strength:split.ex.map(k=>({id:k,sets:p.intensity==='gentle'?2:3,reps:EX[k].icon==='core'?'20–40 Sek.':'8–12',rest:p.intensity==='gentle'?90:75}))}});tailorPlanToEvent();s.logs={};s.done={};s.session=0;s.proposal=null;persistRender();notify('Dein persönlicher Wochenplan wurde erstellt.')}
function plan(){return `${weekSelector()}<div class="grid" style="margin-bottom:16px">${eventGoalEditor()}${eventPlanBanner()}${wellnessCard()}${quickEditCard()}</div><div class="grid two"><div class="card col"><div class="flex between"><h3>Verfügbarkeit für diese Woche</h3><span class="badge">${s.availability.filter(x=>x.on).length} Tage</span></div><p class="muted small">Die Zeiten gelten nur für die oben ausgewählte Kalenderwoche. Du kannst jede Woche anders planen.</p>${availabilityEditor()}<div class="sep"></div><strong>Trainingsziele</strong>${chips(GOALS,s.profile.goals,'toggleGoal')}<div class="field"><label>Priorität</label><select data-field="prioritySelect">${s.profile.goals.map(g=>`<option value="${g}" ${s.profile.priority===g?'selected':''}>${displayGoal(g)}</option>`).join('')}</select></div><div class="field"><label>Kombination</label><select data-field="modeSelect"><option value="combined" ${s.profile.mode==='combined'?'selected':''}>Combined – Ziele in einer Einheit</option><option value="separate" ${s.profile.mode==='separate'?'selected':''}>Getrennte Einheiten</option><option value="smart" ${s.profile.mode==='smart'?'selected':''}>Flexibel durch Planer</option></select></div>${btn(s.plan.length?'Wochenplan neu berechnen':'Meinen Plan erstellen','generate','primary block')}<p class="small muted">Beim Neuberechnen werden nur die Trainingsprotokolle der ausgewählten Woche zurückgesetzt. Andere Wochen bleiben erhalten.</p></div><div class="card col"><div class="flex between"><h3>Trainingswoche · KW ${weekNumber(s.activeWeek)}</h3><span class="pill">${s.plan.length} Einheiten</span></div>${s.plan.length?s.plan.map((w,i)=>`<div class="workoutCard"><div class="flex between"><strong>${LONG[w.day]}</strong><span class="badge">${s.done[w.id]?'✓ Fertig':w.time+' Uhr'}</span></div><h3 style="margin:9px 0 4px">${escapeHTML(w.name)}</h3><p class="small muted">${w.minutes} Minuten · ${w.strength.length} Übungen + ${w.cardioMinutes} Minuten ${w.secondary}</p><div class="spacer"></div><div class="flex gap8 wrap"><button class="btn small primary" data-action="openSession" data-val="${i}">Training öffnen →</button><button class="btn small ghost" data-action="markSkipped" data-val="${i}">${s.done[w.id]?'Zurücksetzen':'Ausfallen lassen'}</button></div></div>`).join(''):`<div class="mutebg"><h3>Dein Plan beginnt hier</h3><p class="muted small">Wähle deine Tage und tippe links auf „Meinen Plan erstellen“.</p></div>`}<div class="mutebg small">Demo-Regel: Laufevents erhalten vor dem Ereignis zusätzliche Laufanteile; Tempo und Kilometersteigerungen werden nicht automatisch vorgegeben. Für einen Marathon ist dies noch kein vollständiger Trainingsplan.</div></div></div>`}
function resolveExercise(ex){const item=EX[ex.id];return s.profile.places.includes('gym')?item.name:item.home}
function training(){if(!s.plan.length)return `<div class="card"><h2>Starte mit deinem Wochenplan</h2><p class="muted" style="margin:11px 0 17px">Nach dem Onboarding kannst du deinen Plan und die ersten Übungen hier bearbeiten.</p>${btn('Plan erstellen →','toPlan','primary')}</div>`;const i=Math.max(0,Math.min(s.session,s.plan.length-1)),w=s.plan[i];let sets=w.strength.reduce((a,ex)=>a+ex.sets,0),done=w.strength.reduce((a,ex)=>a+Array.from({length:ex.sets},(_,j)=>s.logs[`${w.id}-${ex.id}-${j}`]?.done?1:0).reduce((a,b)=>a+b,0),0);return `<div class="grid two"><div class="card col"><h3>Training auswählen</h3><div class="grid two">${s.plan.map((sess,j)=>`<button class="choice ${i===j?'active':''}" data-action="openSession" data-val="${j}"><span><strong>${DAYS[sess.day]}</strong><br><small>${escapeHTML(sess.name)}</small></span>${s.done[sess.id]?'✓':''}</button>`).join('')}</div><div class="mutebg"><div class="flex between"><div><strong>${escapeHTML(w.name)}</strong><p class="muted small">${LONG[w.day]} · ${w.minutes} Minuten</p></div><span class="badge">${done}/${sets} Sätze</span></div><div class="progress" style="margin-top:13px"><i style="width:${sets?done/sets*100:0}%"></i></div></div><div class="mutebg col"><strong>Dein Pausentimer</strong><div class="timerBox" id="timerDisplay">${timerText()}</div><div class="flex gap8">${btn(running?'Pausieren':'Start','timerStart','primary')}${btn('90 Sek.','timer90','small')}${btn('Zurücksetzen','timerReset','small ghost')}</div></div><div class="mutebg"><strong>Coach-Hinweis</strong><p class="muted small" style="margin-top:7px">${checkinHint()}</p><button class="btn small" data-action="suggestLight">Leichtere Einheit vorschlagen</button></div></div><div class="card col"><div class="flex between"><h3>Deine Übungen</h3><span class="badge">${w.strength.length} Übungen</span></div>${w.strength.map((ex,i)=>{const item=EX[ex.id];return `<div class="exercise"><div class="flex between"><div><strong>${i+1}. ${escapeHTML(resolveExercise function progress(){const totalSets=Object.entries(s.logs).filter(([k,v])=>v&&v.done&&k.includes('-')&&!k.endsWith('-cardio')).length,finished=s.plan.filter(x=>s.done[x.id]).length;return `<div class="grid three"><div class="card"><div class="small muted">Einheiten</div><div class="metric">${finished}/${s.plan.length}</div></div><div class="card"><div class="small muted">Erfasste Sätze</div><div class="metric">${totalSets}</div></div><div class="card"><div class="small muted">Hauptziel</div><h3 style="margin-top:12px">${displayGoal(s.profile.priority)}</h3></div></div><div class="spacer"></div><div class="card col" style="margin-bottom:16px"><div class="flex between wrap"><h3>Gewicht & Check-ins</h3>${btn('Neuen Check-in erfassen','checkin','small')}</div><p class="muted small">${weightSummary()}</p>${s.weightHistory.length?`<div class="col">${s.weightHistory.slice(-6).map(x=>`<div class="flex between"><span class="small muted">${new Date(x.date+'T12:00:00').toLocaleDateString('de-DE')}</span><strong>${Number(x.kg).toLocaleString('de-DE')} kg</strong></div>`).join('')}</div>`:'<p class="muted small">Noch keine Gewichtsmessungen gespeichert.</p>'}<div class="sep"></div><strong>Dein Befinden im Verlauf</strong><div class="col">${s.checkinHistory.slice(-7).reverse().map(x=>`<div class="flex between"><span class="muted small">${new Date(x.date+'T12:00:00').toLocaleDateString('de-DE')}</span><span class="small">Energie ${x.energy}/5 · Stress ${x.stress}/5 · Schlaf ${x.sleep==='good'?'gut':x.sleep==='bad'?'schlecht':'okay'}</span></div>`).join('')||'<p class="muted small">Dein erster gespeicherter Check-in erscheint hier.</p>'}</div></div><div class="grid two"><div class="card col"><h3>Trainingsaktivität</h3><div class="chart">${DAYS.map((d,i)=>{const v=s.plan.find(w=>w.day===i);return `<div><b style="height:${v?(s.done[v.id]?90:42):4}px;opacity:${v?(s.done[v.id]?1:.5):.15}"></b><small>${d}</small></div>`}).join('')}</div><p class="muted small">Höhere Balken zeigen abgeschlossene Einheiten.</p></div><div class="card col"><h3>Deine Trainingsziele</h3>${s.profile.goals.map(g=>`<div class="flex between"><strong>${displayGoal(g)}</strong><span class="badge">${g===s.profile.priority?'Priorität':'Ergänzung'}</span></div>`).join('')}<p class="muted small">Später: persönliche Rekorde, Fortschrittsdiagramme, Trainingsvolumen und Health-Integration.</p></div></div>`}
function coachResponse(q){const z=q.toLocaleLowerCase('de');if(/schlaf|müde|erschöpf|stress|regeneration/.test(z))return checkinHint()+' Entscheide nach Befinden, ob du den Umfang reduzieren möchtest.';if(/gewicht|steiger|wiederholung|progress/.test(z))return 'Letzte Gewichtsmessung: '+weightSummary()+'. Einzelne Gewichtsschwankungen führen nicht automatisch zu einer Trainingsänderung. Bei kontrollierter Technik und gleichmäßig erreichter Wiederholungszahl könntest du beim nächsten Mal eine kleine Steigerung prüfen. Die App wird künftig Trainingshistorie und RPE einbeziehen.';if(/zeit|verschieb|ausfall|termin/.test(z))return 'Du kannst im Plan deine verfügbaren Tage und Dauer verändern. Eine Neuberechnung betrifft nur die gewählte Kalenderwoche.';if(/ausdauer|kondition|cardio/.test(z))return 'Deine Kombi aus Muskelaufbau, Kondition und Ausdauer kann Kraftblöcke mit kurzen Cardioabschnitten verbinden. Die Regeneration bleibt dabei wichtig.';if(/schmerz|verletz/.test(z))return 'Bei Schmerzen oder Verletzungen sollte die App keine Diagnose stellen. Vermeide schmerzhafte Bewegungen und lass neue, starke oder anhaltende Beschwerden fachlich abklären.';return 'Ich kann dir im Demo-Modus Hinweise zu Erholung, Gewichten, Verfügbarkeit oder der Kombination deiner Trainingsziele geben. Eine echte KI-Anbindung folgt später.'}
function coach(){return `<div class="grid two"><div class="card col"><div class="flex between"><h3>Coach-Chat</h3><span class="pill">Regelbasierte Demo</span></div><div class="mutebg"><strong>Hallo ${escapeHTML(s.profile.name||'du')}!</strong><p class="small muted">${checkinHint()}</p></div>${s.coachHistory.slice(-8).map(m=>`<div class="coachmsg ${m.mine?'mine':''}">${escapeHTML(m.text)}</div>`).join('')}<div class="field"><label>Frag deinen Coach oder passe dein Training an</label><textarea data-field="coachDraft" id="coachDraft" placeholder="z. B. Ich möchte heute nur laufen gehen.">${escapeHTML(s.coachDraft||'')}</textarea></div>${btn('Nachricht senden →','sendCoach','primary block')}</div><div class="card col"><h3>Aktuelle Coaching-Regeln</h3>${[['Tagesform',checkinHint()],['Trainingsziele',s.profile.goals.map(displayGoal).join(' + ')],['Trainingshäufigkeit',`${s.availability.filter(x=>x.on).length} mögliche Trainingstage`],['Autonomie','Planänderungen werden vorgeschlagen, nicht automatisch durchgesetzt']].map(x=>`<div class="mutebg"><strong>${x[0]}</strong><p class="small muted">${x[1]}</p></div>`).join('')}<p class="muted small">Hinweis: Diese Vorschau nutzt keine generative KI und kann keinen professionellen Trainer oder Arzt ersetzen.</p></div></div>`}
function profile(){return `${eventGoalEditor()}<div class="spacer"></div><div class="grid two"><div class="card col"><h3>Persönliches Profil</h3><div class="field"><label>Dein Name</label><input data-field="name" value="${escapeHTML(s.profile.name)}"></div><div class="grid three"><div class="field"><label>Alter</label><input data-field="age" inputmode="numeric" type="number" min="13" max="100" value="${escapeHTML(s.profile.age)}"></div><div class="field"><label>Größe in cm</label><input data-field="height" inputmode="decimal" type="number" min="100" max="250" value="${escapeHTML(s.profile.height)}"></div><div class="field"><label>Gewicht in kg</label><input data-field="weight" inputmode="decimal" type="number" min="25" max="400" value="${escapeHTML(s.profile.weight)}"></div></div><div class="field"><label>Trainingslevel</label><select data-field="levelSelect">${[['beginner','Einsteiger'],['intermediate','Fortgeschritten'],['advanced','Erfahren']].map(x=>`<option value="${x[0]}" ${s.profile.level===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Zu vermeidende Übungen / Einschränkungen</label><textarea data-field="limitations">${escapeHTML(s.profile.limitations)}</textarea></div><div class="mutebg small">Die Testversion erstellt keine echten Konten. Eingaben bleiben im Browser-Speicher dieses Geräts.</div>${btn('Onboarding erneut durchlaufen','restartOnboarding','ghost')}</div><div class="card col"><h3>Dein App-Design</h3><div class="grid two">${[['dark','Midnight','🌙'],['light','Clean Light','☀️'],['ocean','Ocean Blue','🌊'],['violet','Violet Energy','💜']].map(([id,label,icon])=>`<button class="choice ${s.theme===id?'active':''}" data-action="setTheme" data-val="${id}"><span class="flex"><span class="symbol">${icon}</span><strong>${label}</strong></span>${s.theme===id?'✓':''}</button>`).join('')}</div><div class="sep"></div><h3>Individueller Check-in</h3><p class="muted small">Lege fest, wann du nach deinem Befinden gefragt werden möchtest.</p>${chips([['morning','Morgens','🌤️'],['pre','Vor dem Training','🏋️'],['post','Nach dem Training','✅'],['weekly','Wöchentlich','📆']],s.profile.checkinTiming,'toggleTiming')}<div class="sep"></div><h3>Weitere Module</h3><div class="mutebg small">Ernährung, Health-Apps und Community sind für die Produktversion geplant, in dieser HTML-Testversion aber noch nicht verbunden.</div><button class="btn danger" data-action="resetAll">Gesamte Demo zurücksetzen</button></div></div>`}
function showCheckin(){modal='checkin';renderModal()}
function fig(type){const human=`<circle cx="135" cy="38" r="15" fill="none" stroke="currentColor" stroke-width="5"/><path d="M135 53 L132 102 M132 102 L104 146 M132 102 L163 145 M134 70 L98 93 M134 70 L170 92" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;const object=type==='squat'?`<path d="M50 149 H260" stroke="currentColor" stroke-width="3" opacity=".4"/>`:type==='pull'?`<path d="M192 20 V147 M192 20 H215" fill="none" stroke="var(--acc)" stroke-width="6"/>`:type==='core'?`<path d="M53 145 H257" stroke="currentColor" stroke-width="3" opacity=".4"/>`:`<path d="M80 84 H208 M91 70 V98 M197 70 V98" fill="none" stroke="var(--acc)" stroke-width="6"/>`;return `<svg viewBox="0 0 300 170" role="img" aria-label="Schematisches Übungs-Piktogramm"><g stroke="var(--txt)">${human}${object}</g><text x="150" y="165" text-anchor="middle" fill="var(--muted)" font-size="11">Schematische Illustration · kein Technikvideo</text></svg>`}
function renderModal(){const root=document.getElementById('modalRoot');if(!modal){root.innerHTML='';return}if(modal==='checkin'){root.innerHTML=`<div class="modalshade" data-action="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Tages-Check-in"><div class="flex between"><h2>Wie geht es dir heute?</h2><button class="btn small" data-action="closeModal">✕</button></div><p class="muted small" style="margin:8px 0 18px">Du kannst täglich dein Befinden und regelmäßig dein Gewicht erfassen. Wir berücksichtigen deine Tagesform bei Planungsvorschlägen.</p><div class="field"><label>Wie viel Energie hast du?</label><div class="checkinFaces">${['😴','😕','😐','🙂','💪'].map((e,i)=>`<button class="face ${s.checkin.energy===i+1?'active':''}" data-action="energy" data-val="${i+1}">${e}</button>`).join('')}</div></div><div class="field" style="margin-top:15px"><label>Wie war dein Schlaf?</label><select data-field="sleep"><option value="good" ${s.checkin.sleep==='good'?'selected':''}>Gut</option><option value="okay" ${s.checkin.sleep==='okay'?'selected':''}>Okay</option><option value="bad" ${s.checkin.sleep==='bad'?'selected':''}>Schlecht</option></select></div><div class="field"><label>Stress: ${s.checkin.stress}/5</label><input class="range" type="range" min="1" max="5" value="${s.checkin.stress}" data-field="stress"></div><div class="field"><label>Muskelkater: ${s.checkin.soreness}/5</label><input class="range" type="range" min="1" max="5" value="${s.checkin.soreness}" data-field="soreness"></div><label class="flex"><input type="checkbox" data-field="pain" ${s.checkin.pain?'checked':''}> Ich habe Schmerzen oder Beschwerden</label><div class="spacer"></div><div class="field"><label>Aktuelles Gewicht in kg (optional)</label><input type="number" min="25" max="400" step="0.1" inputmode="decimal" data-field="checkinWeight" placeholder="Nur bei neuer Messung ausfüllen" value="${escapeHTML(s.checkinWeight||'')}"><p class="small muted">Letzter gespeicherter Wert: ${weightSummary()}. Eine Gewichtsschwankung allein verändert nicht automatisch deine Trainingsintensität.</p></div><div class="spacer"></div><div class="mutebg small">${checkinHint()}</div><div class="spacer"></div><button class="btn primary block" data-action="saveCheckin">Check-in für heute speichern</button></div></div>`;return}
if(modal.startsWith('exercise:')){const id=modal.split(':')[1],e=EX[id];root.innerHTML=`<div class="modalshade" data-action="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Übungsinformationen"><div class="flex between"><div><div class="eyebrow">ÜBUNGSDATENBANK</div><h2>${e.name}</h2></div><button class="btn small" data-action="closeModal">✕</button></div><div class="spacer"></div><div class="diagram">${fig(e.icon)}</div><div class="spacer"></div><span class="badge">${e.muscle}</span><div class="spacer"></div><h3>So führst du die Übung aus</h3><p class="muted">${e.tech}</p><div class="spacer"></div><h3>Häufige Fehler</h3><p class="muted">${e.error}</p><div class="spacer"></div><h3>Mögliche Alternativen</h3><p class="muted">${e.alternate}</p><div class="spacer"></div><div class="mutebg small">Für diese Demo verwenden wir schematische Piktogramme. Echte, fachlich geprüfte Übungsbilder und Videos ergänzen wir später.</div><div class="spacer"></div>${btn('Zurück zum Training','closeModal','primary block')}</div></div>`;return}}
function render(){setTheme();document.getElementById('app').innerHTML=s.finished?appShell():onboarding();renderModal();updateTimerDisplay()}
function timeToInt(x){return Math.max(0,Math.floor(Number(x)||0))}function timerText(){const m=Math.floor(s.timer/60),sec=s.timer%60;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}function updateTimerDisplay(){const t=document.getElementById('timerDisplay');if(t)t.textContent=timerText()}
function timerTick(){if(!running)return;s.timer=Math.max(0,s.timer-1);updateTimerDisplay();if(s.timer<=0){running=false;clearInterval(clock);notify('Pause beendet – weiter geht’s!')}}
function changeToggle(arr,id){return arr.includes(id)?arr.filter(x=>x!==id):[...arr,id]}
function changeScreen(v){s.screen=v;persistRender();window.scrollTo(0,0)}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.val;if(a==='closeModal'&&ev.target!==el&&el.classList.contains('modalshade'))return;
if(a==='next'){if(s.onboard===2&&!s.profile.goals.length){notify('Wähle mindestens ein Trainingsziel.');return}if(s.onboard===4&&!s.availability.some(x=>x.on)){notify('Wähle mindestens einen Trainingstag.');return}s.onboard=Math.min(7,s.onboard+1);persistRender();window.scrollTo(0,0);return}
if(a==='back'){s.onboard=Math.max(0,s.onboard-1);persistRender();window.scrollTo(0,0);return}
if(a==='finish'){s.finished=true;genPlan();return}
if(a==='screen'){changeScreen(v);return}
if(a==='toPlan'){changeScreen('plan');return}
if(a==='previewQuick'){proposeText(s.quickDraft);return}
if(a==='applyProposal'){applyProposal();return}
if(a==='rejectProposal'){s.proposal=null;persistRender();return}
if(a==='suggestLight'){if(proposeLight())changeScreen('plan');return}
if(a==='exampleQuick'){s.quickDraft=v==='run'?'Ich möchte heute nur laufen gehen':v==='short'?'Heute habe ich nur 30 Minuten Zeit':'Heute möchte ich eine Pause machen';persistRender();return}
if(a==='toCoach'){changeScreen('coach');return}
if(a==='toTraining'){if(s.session<0)s.session=0;changeScreen('training');return}
if(a==='checkin'){showCheckin();return}
if(a==='saveCheckin'){recordCheckin();return}
if(a==='energy'){s.checkin.energy=Number(v);persistRender();return}
if(a==='level'){s.profile.level=v;persistRender();return}
if(a==='priority'){s.profile.priority=v;persistRender();return}
if(a==='mode'){s.profile.mode=v;persistRender();return}
if(a==='intensity'){s.profile.intensity=v;persistRender();return}
if(a==='setTheme'){s.theme=v;persistRender();return}
if(a==='toggleGoal'){s.profile.goals=changeToggle(s.profile.goals,v);if(!s.profile.goals.length)s.profile.goals=[v];if(!s.profile.goals.includes(s.profile.priority))s.profile.priority=s.profile.goals[0];persistRender();return}
if(a==='togglePlace'){s.profile.places=changeToggle(s.profile.places,v);if(!s.profile.places.length)s.profile.places=['flexible'];persistRender();return}
if(a==='toggleTiming'){s.profile.checkinTiming=changeToggle(s.profile.checkinTiming,v);persistRender();return}
if(a==='toggleDay'){const d=s.availability[Number(v)];d.on=!d.on;persistRender();return}
if(a==='prevWeek'){goWeek(weekShift(s.activeWeek,-1));return}
if(a==='nextWeek'){goWeek(weekShift(s.activeWeek,1));return}
if(a==='todayWeek'){goWeek(weekKey());return}
if(a==='copyPrevious'){const prev=s.weekData&&s.weekData[weekShift(s.activeWeek,-1)];if(!prev||!prev.availability){notify('Noch keine Zeiten aus der Vorwoche vorhanden.');return}if(s.plan.length&&!confirm('Verfügbarkeit übernehmen? Den bestehenden Wochenplan musst du danach neu berechnen.'))return;s.availability=prev.availability.map(x=>({...x}));persistRender();notify('Zeiten der Vorwoche übernommen.');return}
if(a==='generate'){if(s.plan.length&&!confirm('Wochenplan für KW '+weekNumber(s.activeWeek)+' neu berechnen? Nur Protokolle dieser Woche werden zurückgesetzt.'))return;genPlan();return}
if(a==='openSession'){s.session=Number(v);changeScreen('training');return}
if(a==='markSkipped'){const w=s.plan[Number(v)];s.done[w.id]=!s.done[w.id];persistRender();return}
if(a==='exInfo'){modal=`exercise:${v}`;renderModal();return}
if(a==='closeModal'){modal=null;persistRender();return}
if(a==='timerStart'){if(s.timer===0)s.timer=90;running=!running;clearInterval(clock);if(running)clock=setInterval(timerTick,1000);save();render();return}
if(a==='timer90'){s.timer=90;running=false;clearInterval(clock);persistRender();return}
if(a==='timerReset'){s.timer=0;running=false;clearInterval(clock);persistRender();return}
if(a==='completeSet'){const x=s.logs[v]||{};s.logs[v]={...x,done:!x.done};persistRender();return}
if(a==='cardioDone'){const w=s.plan[s.session],k=w.id+'-cardio';s.logs[k]={done:!s.logs[k]?.done};persistRender();return}
if(a==='completeWorkout'){const w=s.plan[s.session];s.done[w.id]=!s.done[w.id];persistRender();notify(s.done[w.id]?'Stark! Einheit abgeschlossen.':'Einheit wieder geöffnet.');return}
if(a==='sendCoach'){const draft=(s.coachDraft||'').trim();if(!draft){notify('Gib zuerst eine Frage ein.');return}if(parseIntent(draft)){s.quickDraft=draft;s.quickTarget='today';s.coachDraft='';s.screen='plan';proposeText(draft);return}s.coachHistory.push({mine:true,text:draft},{mine:false,text:coachResponse(draft)});s.coachDraft='';persistRender();return}
if(a==='restartOnboarding'){if(confirm('Onboarding erneut durchlaufen? Deine bisherigen Trainingsprotokolle bleiben bis zur Neuberechnung des Plans erhalten.')){s.finished=false;s.onboard=0;persistRender()}return}
if(a==='resetAll'){if(confirm('Alle Demo-Daten dieses Browsers löschen und komplett neu beginnen?')){s=DEF();initWeeks();running=false;clearInterval(clock);modal=null;persistRender();window.scrollTo(0,0)}return}
});
document.addEventListener('input',ev=>{const el=ev.target,field=el.dataset.field;if(!field)return;const val=el.type==='checkbox'?el.checked:el.value;
if(['name','age','height','weight'].includes(field))s.profile[field]=val;else if(field==='eventName')s.eventGoal.name=val;else if(field==='eventDate')s.eventGoal.date=val;else if(field==='eventBaseline')s.eventGoal.baseline=val;else if(field==='checkinWeight')s.checkinWeight=val;else if(field==='quickDraft')s.quickDraft=val;else if(field==='limitations')s.profile.limitations=val;else if(field==='coachDraft')s.coachDraft=val;else if(field.startsWith('weight-')||field.startsWith('reps-')){const [attr,k]=[field.startsWith('weight-')?'weight':'reps',field.slice(field.indexOf('-')+1)];s.logs[k]={...s.logs[k],[attr]:val}}else if(field.startsWith('rpe-'))s.logs[field.slice(4)]=val;else if(field==='stress'||field==='soreness'){s.checkin[field]=Number(val);const label=el.parentElement?.querySelector('label');if(label)label.textContent=(field==='stress'?'Stress: ':'Muskelkater: ')+val+'/5'}save();});
document.addEventListener('change',ev=>{const el=ev.target,field=el.dataset.field;if(!field)return;if(['name','age','height','weight','limitations','coachDraft','eventName','eventBaseline','checkinWeight','quickDraft'].includes(field)||field.startsWith('weight-')||field.startsWith('reps-'))return;const val=el.type==='checkbox'?el.checked:el.value;if(field==='quickTarget'){s.quickTarget=val}else if(field==='eventType'){s.eventGoal.type=val;if(!val){s.eventGoal={type:'',name:'',date:'',baseline:''}}}else if(field==='eventDate'){s.eventGoal.date=val}else if(field.startsWith('mins-')){s.availability[Number(field.slice(5))].minutes=Number(val)}else if(field.startsWith('time-')){s.availability[Number(field.slice(5))].start=val}else if(field==='sleep'||field==='stress'||field==='soreness'||field==='pain'){s.checkin[field]=val;if(field==='pain')s.checkin.pain=el.checked}else if(field==='prioritySelect')s.profile.priority=val;else if(field==='modeSelect')s.profile.mode=val;else if(field==='levelSelect')s.profile.level=val;save();render();});
render();
</script></body></html>
